<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador ICTUS SUMMA112</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@keyframes wave {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

.curva {
    width: 100%;
    height: 90px;
    background-repeat: repeat-x;
    background-position: 0 0;
    opacity: 0.96;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.10));
}

@keyframes press {
    0% { transform: scale(1); }
    50% { transform: scale(0.92); }
    100% { transform: scale(1); }
}

@keyframes alarmaRoja {
    0% { color: white; }
    50% { color: red; }
    100% { color: white; }
}
.alarma { animation: alarmaRoja 1s infinite; }
</style>

</head>

<body class="bg-black text-green-400 overflow-hidden">

<div class="flex h-screen">

    <div class="w-1/5 bg-gray-900 p-4 border-r-4 border-gray-700 flex flex-col gap-6">

        <div id="box_fc" onclick="editar('fc')" class="cursor-pointer">
            <p class="text-xl text-green-300">FC</p>
            <p id="fc" class="text-4xl font-bold">72</p>
            <p>bpm</p>
        </div>

        <div id="box_spo2" onclick="editar('spo2')" class="cursor-pointer">
            <p class="text-xl text-blue-300">SpO₂</p>
            <p id="spo2" class="text-4xl text-blue-300 font-bold">96</p>
            <p>%</p>
        </div>

        <div id="box_etco2" onclick="editar('etco2')" class="cursor-pointer">
            <p class="text-xl text-yellow-300">EtCO₂</p>
            <p id="etco2" class="text-4xl text-yellow-300 font-bold">--</p>
            <p>mmHg</p>
        </div>

        <div id="box_ta" onclick="editarTA()" class="cursor-pointer">
            <p class="text-xl text-red-300">TA</p>
            <p id="ta" class="text-4xl font-bold">135/80</p>
            <p>mmHg</p>
        </div>

    </div>

    <div class="w-4/5 p-4 flex flex-col">

        <div class="flex justify-between items-center mb-4">
            <div class="text-3xl w-full text-center" id="cronometro">00:00:00</div>

            <div id="botonSUMMA"
                onclick="toggleSUMMA()"
                class="cursor-pointer ml-4 bg-white p-2 rounded-lg shadow-xl"
                style="width:150px;">

                <div class="flex">
                    <div style="width:50%; height:40px;">
                        <div style="background:#cc0000; height:33%;"></div>
                        <div style="background:yellow; height:33%;"></div>
                        <div style="background:#cc0000; height:33%;"></div>
                    </div>

                    <div style="width:50%; height:40px; background:#cc0000;">
                        <div style="display:flex; justify-content:center; gap:3px; padding-top:2px;">
                            <span style="color:white;">★</span><span style="color:white;">★</span>
                            <span style="color:white;">★</span><span style="color:white;">★</span>
                        </div>
                        <div style="display:flex; justify-content:center; gap:3px;">
                            <span style="color:white;">★</span><span style="color:white;">★</span>
                            <span style="color:white;">★</span>
                        </div>
                    </div>
                </div>

                <div class="text-center text-blue-600 font-bold text-xl mt-1"
                     style="font-family:Arial; text-shadow:0 0 3px white;">
                    SUMMA112
                </div>
            </div>
        </div>

        <div class="flex flex-col gap-6 w-full overflow-hidden">
            <div class="overflow-hidden"><div class="curva ecg"></div></div>
            <div class="overflow-hidden"><div class="curva etco2_curve"></div></div>
            <div class="overflow-hidden"><div class="curva spo2_curve"></div></div>
        </div>
    </div>
</div>

<script>
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let fc_val = 72;
let intervalLatido;
let segundos = 0;
let intervalCrono;
let activoSUMMA = false;
let waveAnimationId = null;
let waveTime = 0;

function calcularOndas(){
    return Math.max(1, Math.floor(fc_val / 10));
}

function svgToDataUri(svg) {
    return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

function generarPatronECG(ondas) {
    const w = 1600;
    const h = 90;
    const espacio = w / Math.max(ondas, 1);
    const puntos = [];

    for (let i = 0; i < ondas; i++) {
        const inicio = i * espacio;
        puntos.push(`${inicio},45`);
        puntos.push(`${inicio + 30},45`);
        puntos.push(`${inicio + 40},10`);
        puntos.push(`${inicio + 60},80`);
        puntos.push(`${inicio + 80},45`);
        puntos.push(`${inicio + 200},45`);
        puntos.push(`${inicio + 215},15`);
        puntos.push(`${inicio + 235},45`);
        puntos.push(`${inicio + espacio},45`);
    }

    const polyline = puntos.map((p, idx) => idx === 0 ? `M ${p}` : `L ${p}`).join(' ');
    return `
      <svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
        <path d="${polyline}" fill="none" stroke="lime" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    `;
}

function generarPatronSpO2(ondas) {
    const w = 1600;
    const h = 90;
    const espacio = w / Math.max(ondas, 1);
    const chunks = [];

    for (let i = 0; i < ondas; i++) {
        const inicio = i * espacio;
        chunks.push(`${inicio},60`);
        chunks.push(`${inicio + 80},55`);
        chunks.push(`${inicio + 160},48`);
        chunks.push(`${inicio + 240},52`);
        chunks.push(`${inicio + 320},62`);
        chunks.push(`${inicio + 400},70`);
        chunks.push(`${inicio + 480},63`);
        chunks.push(`${inicio + espacio},60`);
    }

    const polyline = chunks.map((p, idx) => idx === 0 ? `M ${p}` : `L ${p}`).join(' ');
    return `
      <svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
        <path d="${polyline}" fill="none" stroke="cyan" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    `;
}

function generarPatronEtCO2(ondas) {
    const w = 1600;
    const h = 90;
    const espacio = w / Math.max(ondas, 1);
    const chunks = [];

    for (let i = 0; i < ondas; i++) {
        const inicio = i * espacio;
        chunks.push(`${inicio},80`);
        chunks.push(`${inicio + 200},80`);
        chunks.push(`${inicio + 250},20`);
        chunks.push(`${inicio + 400},20`);
        chunks.push(`${inicio + 420},80`);
        chunks.push(`${inicio + espacio},80`);
    }

    const polyline = chunks.map((p, idx) => idx === 0 ? `M ${p}` : `L ${p}`).join(' ');
    return `
      <svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
        <path d="${polyline}" fill="none" stroke="yellow" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    `;
}

function actualizarCurvas() {
    const ondas = calcularOndas();
    const velocidad = (fc_val / 60) * 2.2;

    document.querySelectorAll('.curva').forEach(el => {
        el.style.backgroundSize = `${(1600 / ondas)}px 100%`;
    });

    const ecg = svgToDataUri(generarPatronECG(ondas));
    const spo2 = svgToDataUri(generarPatronSpO2(ondas));
    const etco2 = svgToDataUri(generarPatronEtCO2(ondas));

    document.querySelector('.ecg').style.backgroundImage = `url("${ecg}")`;
    document.querySelector('.spo2_curve').style.backgroundImage = `url("${spo2}")`;
    document.querySelector('.etco2_curve').style.backgroundImage = `url("${etco2}")`;

    const offset = (waveTime * velocidad * 6) % (1600 / ondas);
    document.querySelector('.ecg').style.backgroundPosition = `${-offset}px 0`;
    document.querySelector('.spo2_curve').style.backgroundPosition = `${-offset * 0.9}px 0`;
    document.querySelector('.etco2_curve').style.backgroundPosition = `${-offset * 1.1}px 0`;
}

function animarOndas() {
    if (waveAnimationId) cancelAnimationFrame(waveAnimationId);

    const paso = () => {
        waveTime += 0.016;
        actualizarCurvas();
        waveAnimationId = requestAnimationFrame(paso);
    };

    waveAnimationId = requestAnimationFrame(paso);
}

function sonidoLatido(){
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = 800;
    g.gain.setValueAtTime(0.5, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.15);
}

function iniciarLatidos(){
    clearInterval(intervalLatido);
    intervalLatido = setInterval(sonidoLatido, 60000 / fc_val);
}

function actualizarCrono(){
    segundos++;
    const h = String(Math.floor(segundos/3600)).padStart(2,'0');
    const m = String(Math.floor((segundos%3600)/60)).padStart(2,'0');
    const s = String(segundos%60).padStart(2,'0');
    cronometro.textContent = `${h}:${m}:${s}`;
}

function iniciarCrono(){ intervalCrono = setInterval(actualizarCrono,1000); }
function pararCrono(){
    clearInterval(intervalCrono);
    segundos = 0;
    cronometro.textContent = '00:00:00';
}

function toggleSUMMA(){
    const btn = document.getElementById('botonSUMMA');
    btn.style.animation = 'press 0.3s';

    activoSUMMA = !activoSUMMA;

    if (activoSUMMA){
        iniciarCrono();
        iniciarLatidos();
    } else {
        pararCrono();
        clearInterval(intervalLatido);
    }

    setTimeout(() => btn.style.animation = '', 300);
}

function editar(id){
    const el = document.getElementById(id);
    const v = prompt('Nuevo valor:', el.textContent);
    if (!v) return;
    el.textContent = v;
    if (id === 'fc') {
        fc_val = parseInt(v) || 72;
        actualizarCurvas();
        iniciarLatidos();
    }
    checkAlarmas();
}

function editarTA(){
    const el = document.getElementById('ta');
    const v = prompt('Nueva TA:', el.textContent);
    if (!v) return;
    el.textContent = v;
    checkAlarmas();
}

function clearAlarmas(){
    ['box_fc', 'box_spo2', 'box_ta'].forEach(id =>
        document.getElementById(id).classList.remove('alarma')
    );
}

function checkAlarmas(){
    clearAlarmas();
    const fc = parseInt(fc_val);
    const spo = parseInt(spo2.textContent);
    const sist = parseInt(ta.textContent.split('/')[0]);

    if (fc > 120) box_fc.classList.add('alarma');
    if (spo < 92) box_spo2.classList.add('alarma');
    if (sist > 170) box_ta.classList.add('alarma');
}

actualizarCurvas();
animarOndas();
</script>

</body>
</html>
