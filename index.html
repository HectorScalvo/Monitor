<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador ICTUS SUMMA112</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
  .curva {
    width: 100%;
    height: 90px;
    overflow: hidden;
    position: relative;
    display: block;
    background: rgba(255,255,255,0.02);
  }

  .curva svg {
    display: block;
    width: 100%;
    height: 100%;
    min-width: 100%;
    will-change: transform;
  }

  .curva.ecg svg,
  .curva.spo2_curve svg,
  .curva.etco2_curve svg {
    animation: drift 2s linear infinite;
  }

  @keyframes drift {
    0% { transform: translateX(0); }
    100% { transform: translateX(-12%); }
  }

  @keyframes press {
    0% { transform: scale(1); }
    50% { transform: scale(0.92); }
    100% { transform: scale(1); }
  }

  @keyframes alarmaRoja {
    0% { color: white; }
    50% { color: red; }
    100% { color: white; }
  }

  .alarma { animation: alarmaRoja 1s infinite; }
</style>
</head>

<body class="bg-black text-green-400 overflow-hidden">

<div class="flex h-screen">

    <div class="w-1/5 bg-gray-900 p-4 border-r-4 border-gray-700 flex flex-col gap-6">

        <div id="box_fc" onclick="editar('fc')" class="cursor-pointer">
            <p class="text-xl text-green-300">FC</p>
            <p id="fc" class="text-4xl font-bold">72</p>
            <p>bpm</p>
        </div>

        <div id="box_spo2" onclick="editar('spo2')" class="cursor-pointer">
            <p class="text-xl text-blue-300">SpO₂</p>
            <p id="spo2" class="text-4xl text-blue-300 font-bold">96</p>
            <p>%</p>
        </div>

        <div id="box_etco2" onclick="editar('etco2')" class="cursor-pointer">
            <p class="text-xl text-yellow-300">EtCO₂</p>
            <p id="etco2" class="text-4xl text-yellow-300 font-bold">--</p>
            <p>mmHg</p>
        </div>

        <div id="box_ta" onclick="editarTA()" class="cursor-pointer">
            <p class="text-xl text-red-300">TA</p>
            <p id="ta" class="text-4xl font-bold">135/80</p>
            <p>mmHg</p>
        </div>

    </div>

    <div class="w-4/5 p-4 flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <div class="text-3xl w-full text-center" id="cronometro">00:00:00</div>

            <div id="botonSUMMA"
                onclick="toggleSUMMA()"
                class="cursor-pointer ml-4 bg-white p-2 rounded-lg shadow-xl"
                style="width:150px;">

                <div class="flex">
                    <div style="width:50%; height:40px;">
                        <div style="background:#cc0000; height:33%;"></div>
                        <div style="background:yellow; height:33%;"></div>
                        <div style="background:#cc0000; height:33%;"></div>
                    </div>

                    <div style="width:50%; height:40px; background:#cc0000;">
                        <div style="display:flex; justify-content:center; gap:3px; padding-top:2px;">
                            <span style="color:white;">★</span><span style="color:white;">★</span>
                            <span style="color:white;">★</span><span style="color:white;">★</span>
                        </div>
                        <div style="display:flex; justify-content:center; gap:3px;">
                            <span style="color:white;">★</span><span style="color:white;">★</span>
                            <span style="color:white;">★</span>
                        </div>
                    </div>
                </div>

                <div class="text-center text-blue-600 font-bold text-xl mt-1"
                     style="font-family:Arial; text-shadow:0 0 3px white;">
                    SUMMA112
                </div>
            </div>
        </div>

        <div class="flex flex-col gap-6 w-full overflow-hidden">
            <div class="overflow-hidden curva ecg"></div>
            <div class="overflow-hidden curva etco2_curve"></div>
            <div class="overflow-hidden curva spo2_curve"></div>
        </div>
    </div>
</div>

<script>
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let fc_val = 72;
let intervalLatido;
let segundos = 0;
let intervalCrono;
let activoSUMMA = false;

function calcularOndas() {
    return Math.max(1, Math.floor(fc_val / 10));
}

function generarComplejoECG(x) {
    return `
      M ${x} 45
      L ${x+22} 45
      L ${x+28} 45
      L ${x+42} 12
      L ${x+66} 84
      L ${x+94} 45
      L ${x+120} 45
      L ${x+160} 45
    `;
}

function generarECG(ondas) {
    const ancho = 160 * ondas;
    let d = '';

    for (let i = 0; i < ondas; i++) {
        const x = i * 160;
        d += generarComplejoECG(x);
    }

    return `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${ancho} 90" preserveAspectRatio="none">
        <path d="${d}" fill="none" stroke="lime" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    `;
}

function generarSpO2(ondas) {
    const ancho = 170 * ondas;
    let d = '';
    for (let i = 0; i < ondas; i++) {
        const x = i * 170;
        d += `M ${x} 60 L ${x+80} 55 L ${x+160} 48 L ${x+240} 52 L ${x+320} 62 L ${x+400} 70 L ${x+480} 63 L ${x+560} 60 `;
    }
    return `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${ancho} 90" preserveAspectRatio="none">
        <path d="${d}" fill="none" stroke="cyan" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    `;
}

function generarEtCO2(ondas) {
    const ancho = 170 * ondas;
    let d = '';
    for (let i = 0; i < ondas; i++) {
        const x = i * 170;
        d += `M ${x} 80 L ${x+200} 80 L ${x+250} 20 L ${x+420} 20 L ${x+470} 80 L ${x+560} 80 `;
    }
    return `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${ancho} 90" preserveAspectRatio="none">
        <path d="${d}" fill="none" stroke="yellow" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    `;
}

function actualizarCurvas() {
    const ondas = calcularOndas();
    const periodo = Math.max(0.8, 60 / fc_val);

    document.querySelector('.ecg').innerHTML = generarECG(ondas);
    document.querySelector('.spo2_curve').innerHTML = generarSpO2(ondas);
    document.querySelector('.etco2_curve').innerHTML = generarEtCO2(ondas);

    document.querySelectorAll('.curva svg').forEach(svg => {
        svg.style.animationDuration = `${periodo}s`;
    });
}

function sonidoLatido(){
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const now = audioCtx.currentTime;
    o.frequency.setValueAtTime(800, now);
    o.frequency.exponentialRampToValueAtTime(620, now + 0.18);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.6, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
    o.connect(g).connect(audioCtx.destination);
    o.start(now);
    o.stop(now + 0.18);
}

function iniciarLatidos(){
    clearInterval(intervalLatido);
    intervalLatido = setInterval(sonidoLatido, 60000 / fc_val);
}

function actualizarCrono(){
    segundos++;
    const h = String(Math.floor(segundos/3600)).padStart(2,'0');
    const m = String(Math.floor((segundos%3600)/60)).padStart(2,'0');
    const s = String(segundos%60).padStart(2,'0');
    cronometro.textContent = `${h}:${m}:${s}`;
}

function iniciarCrono(){
    intervalCrono = setInterval(actualizarCrono, 1000);
}

function pararCrono(){
    clearInterval(intervalCrono);
    segundos = 0;
    cronometro.textContent = '00:00:00';
}

function toggleSUMMA(){
    const btn = document.getElementById('botonSUMMA');
    btn.style.animation = 'press 0.3s';

    activoSUMMA = !activoSUMMA;

    if (activoSUMMA){
        iniciarCrono();
        iniciarLatidos();
    } else {
        pararCrono();
        clearInterval(intervalLatido);
    }

    setTimeout(() => btn.style.animation = '', 300);
}

function editar(id){
    const el = document.getElementById(id);
    const v = prompt('Nuevo valor:', el.textContent);
    if (!v) return;
    el.textContent = v;
    if (id === 'fc') {
        fc_val = parseInt(v) || 72;
        actualizarCurvas();
        iniciarLatidos();
    }
    checkAlarmas();
}

function editarTA(){
    const el = document.getElementById('ta');
    const v = prompt('Nueva TA:', el.textContent);
    if (!v) return;
    el.textContent = v;
    checkAlarmas();
}

function clearAlarmas(){
    ['box_fc', 'box_spo2', 'box_ta'].forEach(id =>
        document.getElementById(id).classList.remove('alarma')
    );
}

function checkAlarmas(){
    clearAlarmas();
    const fc = parseInt(fc_val);
    const spo = parseInt(spo2.textContent);
    const sist = parseInt(ta.textContent.split('/')[0]);

    if (fc > 120) box_fc.classList.add('alarma');
    if (spo < 92) box_spo2.classList.add('alarma');
    if (sist > 170) box_ta.classList.add('alarma');
}

actualizarCurvas();
</script>

</body>
</html>
